<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ settings.SITE_NAME }}{% endblock %}</title>
    {% block meta %}{% endblock %}
    <!-- TODO: шрифты пока с Google Fonts, позже перенести в static (ТЗ, F7) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
      <div class="container header-inner">
        <p class="brand">
          <a href="/" class="brand-link">{{ settings.SITE_NAME }}</a>
        </p>
        {% block nav %}{% include 'partials/top_panel.html' %}{% endblock %}
      </div>
    </header>

    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
